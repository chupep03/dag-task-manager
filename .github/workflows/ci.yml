name: CI

on:
  push:
    branches: [ main, master, 'deadline_*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libcurl4-openssl-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: | 
          cd build
          make

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure